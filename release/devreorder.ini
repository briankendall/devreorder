; devreorder settings
; Any line starting with ; is a comment and will be ignored

[order]
; In this section write the names, GUIDs, or device instance
; IDs of your controllers in the order you want them to be
; detected, one per line.
; Make sure any names exactly match the name printed in the
; Game Controllers control panel or in DeviceLister.exe,
; including any capital letters and punctuation. If you use
; a device's GUID instead of its name, make sure the GUID is
; enclosed in curly braces, just like in DeviceLister.exe.
; Similarly device instance IDs must match DeviceLister.exe
; and be enclosed in triangle brackets.
; Example:
; vJoy Device
; Controller (XBOX 360 For Windows)
; {01234567-89ab-cdef-0123-456789abcdef}
; <HID\HIDCLASSOFx86\something&12345>

[hidden]
; In this section, list the controllers
; that you want to be hidden, one per line. Each
; line names a controller with exactly ONE of:
;   - its name, matching exactly (including
;     capital letters and punctuation) the name
;     printed in the Game Controllers control
;     panel or in DeviceLister.exe,
;   - its GUID, enclosed in curly braces, e.g.
;     {01234567-89ab-cdef-0123-456789abcdef}, or
;   - its device instance ID, enclosed in
;     triangle brackets, e.g.
;     <HID\HIDCLASSOFx86\something&12345>.
; A controller is hidden if it matches ANY line
; in this section, so one line per controller
; is enough. Use a GUID or device instance ID
; when several controllers share the same name,
; so that only the one you mean is hidden.
; Example (each line shows one way to name a controller):
; Wireless Controller
; {01234567-89ab-cdef-0123-456789abcdef}
; <HID\HIDCLASSOFx86\something&12345>

[visible]
; In this section, list the controllers that you want to be
; the only controllers which are visible, one per line. Each
; line names a controller with exactly ONE of:
;   - its name, matching exactly (including
;     capital letters and punctuation) the name
;     printed in the Game Controllers control
;     panel or in DeviceLister.exe,
;   - its GUID, enclosed in curly braces, e.g.
;     {01234567-89ab-cdef-0123-456789abcdef}, or
;   - its device instance ID, enclosed in
;     triangle brackets, e.g.
;     <HID\HIDCLASSOFx86\something&12345>.
; If this section is not empty, then all controllers
; that do not match any line in it will be hidden.
; If this section is left blank, then it will have no
; effect and only the controllers in the [hidden] section
; will be invisible. (This does not affect keyboards,
; mice, and other pointing devices.)
; Example (each line shows one way to name a controller):
; Controller (XBOX 360 For Windows)
; {01234567-89ab-cdef-0123-456789abcdef}
; <HID\HIDCLASSOFx86\something&12345>

[ignored processes]
; In this section, write the names of processes you want
; devreorder to ignore so that the order and visibility of
; their controllers are not changed, as though devreorder is
; not installed. Matches are not case sensitive. Be sure to
; include the file extension as well.
; Example:
; steam.exe
